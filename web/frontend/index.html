<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semantic Navigator</title>
    <link rel="stylesheet" href="styles.css?v=8">
</head>
<body>
    <div class="container">
        <header>
            <div class="header-top">
                <h1>Semantic Document Navigator</h1>
                <div class="controls">
                    <div class="nav-controls">
                        <button id="back-btn" type="button">Back</button>
                        <button id="forward-btn" type="button">Forward</button>
                        <button id="up-btn" type="button">Up</button>
                    </div>
                    <div class="search-wrap">
                        <input
                            id="search-input"
                            type="search"
                            placeholder="Search titles..."
                            autocomplete="off"
                            spellcheck="false"
                        >
                        <div id="search-results" class="search-results hidden"></div>
                    </div>
                    <button id="reset-btn" type="button">Reset</button>
                    <span id="status">Loading...</span>
                </div>
            </div>
            <nav id="breadcrumb" class="breadcrumb"></nav>
        </header>

        <main>
            <section id="levels-panel" class="levels-panel"></section>

            <aside id="sidebar">
                <div id="details-panel">
                    <h2 id="doc-title">All Documents</h2>
                    <div class="meta" id="doc-id"></div>
                    <div class="content" id="doc-intro">
                        Loading...
                    </div>
                </div>
            </aside>
        </main>
    </div>
    <script type="module" src="app.js?v=8"></script>
</body>
</html>
